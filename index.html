<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DrumFeedback — 드럼 BPM 측정</title>
    <meta name="description" content="드럼 치는 소리를 듣고 지금 몇 BPM인지, 어디서 빨라지고 느려졌는지 알려 주는 웹 도구. 설치 없이 마이크만 켜면 돼요." />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="DrumFeedback — 드럼 BPM 측정" />
    <meta property="og:description" content="드럼 치는 소리를 듣고 지금 몇 BPM인지, 어디서 빨라지고 느려졌는지 알려 줘요." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="stage" class="stage" data-phase="off">
      <!-- 뒤에서 아래→위로 흐르는 빠르기 그래프: 가운데가 기준, 오른쪽이 빠름, 왼쪽이 느림 -->
      <canvas id="graph" role="img" aria-label="시간에 따른 빠르기 그래프"></canvas>

      <header class="top">
        <h1 class="brand">DrumFeedback</h1>
        <p class="status" role="status"><i aria-hidden="true"></i><span id="status">대기</span></p>
      </header>

      <section class="center">
        <p id="eyebrow" class="eyebrow">BPM</p>
        <p id="bpm" class="bpm empty">—</p>
        <p id="delta" class="delta">드럼을 치면 지금 빠르기를 알려 드려요</p>
      </section>

      <footer class="dock">
        <div class="controls">
          <button id="half" class="side" disabled title="두 배로 읽혔을 때 반으로">½×</button>
          <button id="toggle" class="main" aria-label="측정 시작"><span id="toggle-label">시작</span></button>
          <button id="double" class="side" disabled title="절반으로 읽혔을 때 두 배로">2×</button>
        </div>
        <div class="settings">
          <label class="field">
            <span>리듬</span>
            <select id="feel" aria-label="리듬: 하이햇이나 라이드를 어떻게 나눠 치는지">
              <option value="">자동</option>
              <option value="eighth">8비트 · 하프타임</option>
              <option value="sixteenth">16비트 · 펑크</option>
              <option value="shuffle">셔플 · 스윙</option>
              <option value="bounce">바운스 (16분 스윙)</option>
              <option value="triplet">셋잇단 · 6/8 · 12/8</option>
              <option value="quarter">4분음표만</option>
            </select>
          </label>
          <label class="field">
            <span>목표 템포</span>
            <input id="target" type="number" inputmode="numeric" min="30" max="300" step="1" placeholder="자동" />
          </label>
        </div>
        <p id="feel-hint" class="hint">합주할 땐 리듬을 골라 두면 다른 악기 소리에 덜 흔들려요</p>
        <a id="more" class="more" href="#report" hidden>결과 자세히 <span aria-hidden="true">↓</span></a>
      </footer>
      <div class="level" aria-hidden="true"><div id="level"></div></div>
    </main>

    <section id="report" class="report" hidden>
      <div class="report-head">
        <h2>이번 연습</h2>
        <span id="report-time" class="muted"></span>
      </div>
      <div id="tiles" class="tiles"></div>
      <div id="takes"></div>
      <p class="fine">소리는 이 기기 안에서만 분석하고 저장하거나 보내지 않아요.<br />숫자가 두 배나 절반으로 나오면 ½× · 2×로 바로잡으세요.</p>
    </section>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
